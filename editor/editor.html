<!DOCTYPE html>
<html>
<head>
  <title>Panda3D WebGL Live Python Editor</title>
  <link rel="shortcut icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  
  <style type="text/css">
    :root {
      --bg-color: #050505;
      --fg-primary: #00FF41;
      --fg-secondary: #008F11;
      --fg-alert: #FFB000;
      --crt-glow: 0 0 5px var(--fg-primary), 0 0 2px var(--fg-primary);
      --crt-dim-glow: 0 0 3px var(--fg-secondary);
      --ui-border: 2px solid var(--fg-secondary);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-color);
      font-family: 'VT323', monospace;
      color: var(--fg-primary);
      text-transform: uppercase;
    }

    .scanlines {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.6;
    }

    #header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50px;
      background-color: var(--bg-color);
      border-bottom: var(--ui-border);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 2px 10px rgba(0, 255, 65, 0.1);
    }

    #header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button, .menu-btn {
      min-width: unset;
      background: var(--bg-color);
      border: var(--ui-border);
      color: var(--fg-primary);
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 6px 14px;
      margin: 0;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      text-shadow: var(--crt-glow);
      box-shadow: 3px 3px 0 var(--fg-secondary);
      transition: all 0.1s;
    }
    
    button:hover, .menu-btn:hover, .menu-btn.open { 
      background-color: var(--fg-primary); 
      color: var(--bg-color);
      text-shadow: none;
    }
    
    button:active, .menu-btn:active {
      transform: translate(3px, 3px);
      box-shadow: none;
    }
    
    button:disabled { 
      color: #333; 
      border-color: #333;
      box-shadow: 3px 3px 0 #333;
      cursor: default; 
      text-shadow: none;
    }

    .menu-dropdown {
      display: none;
      position: absolute;
      top: 40px;
      left: -2px;
      min-width: 180px;
      background: var(--bg-color);
      border: var(--ui-border);
      z-index: 100;
      flex-direction: column;
      box-shadow: 5px 5px 0 var(--fg-secondary);
    }
    .menu-btn.open .menu-dropdown {
      display: flex;
    }
    .menu-dropdown a {
      display: block;
      padding: 10px 16px;
      font-size: 18px;
      color: var(--fg-primary);
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      text-shadow: var(--crt-glow);
    }
    .menu-dropdown a:hover { 
      background: var(--fg-primary); 
      color: var(--bg-color);
      text-shadow: none;
    }
    .menu-dropdown .separator {
      height: 2px;
      background: var(--fg-secondary);
      margin: 0;
    }

    #main-area {
      position: absolute;
      top: 50px; bottom: 35px;
      left: 0; right: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      #main-area { flex-direction: column !important; }
      .gutter-horizontal { display: none; }
    }

    #panel-sidebar {
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow-y: auto;
    }

    .tree-title {
      font-size: 20px;
      border-bottom: 1px solid var(--fg-secondary);
      margin-bottom: 10px;
      padding-bottom: 5px;
      text-shadow: var(--crt-glow);
    }

    .file-item {
      cursor: pointer;
      padding: 4px 0;
      font-size: 18px;
      transition: color 0.1s;
    }
    .file-item:hover {
      background: var(--fg-primary);
      color: var(--bg-color);
    }
    .file-item.active {
      color: var(--fg-alert);
      text-shadow: 0 0 5px var(--fg-alert);
    }

    #panel-output {
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
      overflow: hidden;
    }

    #panel-input {
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
      position: relative;
    }

    #editor-tabs {
      display: flex;
      background: var(--bg-color);
      border-bottom: var(--ui-border);
      height: 35px;
      overflow-x: auto;
    }
    
    .tab {
      padding: 8px 16px;
      border-right: var(--ui-border);
      cursor: pointer;
      font-size: 18px;
      background: var(--bg-color);
      color: var(--fg-secondary);
    }
    .tab.active {
      background: var(--fg-primary);
      color: var(--bg-color);
      font-weight: bold;
    }
    .tab:hover:not(.active) {
      background: #111;
      color: var(--fg-primary);
    }

    .gutter {
      background-color: var(--bg-color);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><rect width="2" height="10" fill="%23008F11"/></svg>');
      background-repeat: repeat-y;
      background-position: center;
      border-left: var(--ui-border);
      border-right: var(--ui-border);
      z-index: 50; /* Keeps the drag line above the 3D Canvas */
    }
    .gutter.gutter-horizontal { cursor: col-resize; }
    .gutter.gutter-vertical { cursor: row-resize; border: none; border-top: var(--ui-border); border-bottom: var(--ui-border); background-repeat: repeat-x;}

    #editor-container {
      flex: 1;
      position: relative;
    }
    #editor {
      position: absolute;
      inset: 0;
      margin: 0;
      font-family: 'VT323', monospace !important;
      font-size: 18px !important;
    }

    #main {
      width: 100%;
      position: relative;
      background: #000;
      min-height: 0; /* Allows Split.js to shrink the panel */
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Stops canvas from bleeding over the drag line */
    }

    canvas#canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 0;
      cursor: crosshair;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
    }

    #center-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      border: var(--ui-border);
      padding: 30px;
      box-shadow: 10px 10px 0 var(--fg-secondary);
    }

    .blinking-text {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    #status {
      font-weight: 700;
      font-size: 24px;
      color: var(--fg-primary);
      text-align: center;
      text-shadow: var(--crt-glow);
      margin-bottom: 20px;
    }

    #ldbar-outer {
      display: inline-block;
      background-color: var(--bg-color);
      border: 2px solid var(--fg-secondary);
      height: 20px;
      width: 300px;
      overflow: hidden;
    }
    
    #ldbar {
      background-color: var(--fg-primary);
      width: 0%;
      height: 100%;
      transition: width 0.1s step-end;
    }

    #terminal-container {
      width: 100%;
      padding: 0px; /* Removed padding so scrollbar hugs the edge */
      background: var(--bg-color);
      z-index: 15;
      position: relative;
      overflow: hidden;
      min-height: 0; /* Allows Split.js to shrink the panel */
    }

    /* Small buffer specifically for the terminal text, independent of scrollbar */
    .xterm-viewport { padding-left: 5px; }

    #dropzone {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 9998; /* Below scanlines, above the editor */
      background: rgba(5, 5, 5, 0.85);
      border: 4px dashed var(--fg-primary);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--fg-primary);
      font-size: 40px;
      text-shadow: var(--crt-glow);
    }
    #dropzone.active { display: flex; }

    #credits {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 35px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      background-color: var(--bg-color);
      border-top: var(--ui-border);
      font-size: 16px;
      z-index: 25;
      text-shadow: var(--crt-dim-glow);
    }

    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); border-left: 1px solid var(--fg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--fg-secondary); }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg-primary); }
    ::-webkit-scrollbar-corner { background: var(--bg-color); }

    body.theme-classic {
      --bg-color: #181818;
      --fg-primary: #eee;
      --fg-secondary: #444;
      --fg-alert: gold;
      --crt-glow: none;
      --crt-dim-glow: none;
      --ui-border: 1px solid #333;
    }
    body.theme-classic .scanlines { display: none; }
    body.theme-classic #console { color: #eee; text-shadow: none; }
    body.theme-classic button, body.theme-classic .menu-btn { box-shadow: none; }
    body.theme-classic .menu-dropdown { box-shadow: none; }
    body.theme-classic .gutter { background-image: none; background-color: #2a2a2a; }
    /* Disable uppercase forced styling for classic theme */
    body.theme-classic, body.theme-classic * { text-transform: none !important; }
  </style>

  <script type="text/javascript">
    let openFiles = ['/main.py'];
    let currentOpenFile = '/main.py';

    function buildFileTree(dir, level=0) {
      let html = '';
      try {
        let items = FS.readdir(dir);
        // System folders to hide from root
        let sysSkip = ['dev', 'proc', 'tmp', 'home'];
        
        for (let item of items) {
          // ALWAYS skip current (.) and parent (..) directory pointers to prevent infinite loops
          if (item === '.' || item === '..') continue;
          
          // Hide internal Emscripten system folders only at the root level
          if (level === 0 && sysSkip.includes(item)) continue;
          
          let path = dir === '/' ? '/' + item : dir + '/' + item;
          let stat = FS.stat(path);
          let indent = '&nbsp;&nbsp;'.repeat(level);
          
          if (FS.isDir(stat.mode)) {
            html += `<div class="file-item" style="color: var(--fg-secondary); cursor: default;"><b>${indent}[+] ${item}/</b></div>`;
            html += buildFileTree(path, level + 1); // Recursive call for nested folders
          } else {
            let activeClass = (path === currentOpenFile) ? 'active' : '';
            html += `<div class="file-item ${activeClass}" onclick="openFileFromFS('${path}')">${indent}|-- ${item}</div>`;
          }
        }
      } catch (e) { console.error("Error reading FS:", e); }
      return html;
    }

    function refreshSidebar() {
      if (typeof FS === 'undefined') return;
      document.getElementById('file-tree').innerHTML = buildFileTree('/');
    }

    function updateTabs() {
      let html = '';
      openFiles.forEach(path => {
        let filename = path.split('/').pop();
        let activeClass = (path === currentOpenFile) ? 'active' : '';
        html += `<div class="tab ${activeClass}" onclick="openFileFromFS('${path}')">${filename} <span style="margin-left:8px; cursor:pointer;" onclick="event.stopPropagation(); closeTab('${path}')">[x]</span></div>`;
      });
      document.getElementById('editor-tabs').innerHTML = html;
    }

    function closeTab(path) {
      openFiles = openFiles.filter(p => p !== path);
      if (openFiles.length === 0) {
        newFile(); // If last tab is closed, prompt for a new one
      } else if (currentOpenFile === path) {
        openFileFromFS(openFiles[openFiles.length - 1]); // Switch to the last remaining tab
      } else {
        updateTabs();
      }
    }

    function openFileFromFS(path) {
      try {
        // Prevent binary files from breaking the Ace text parser
        if (path.match(/\.(png|jpg|jpeg|bam|ogg|wav)$/i)) {
           term.writeln(`\x1b[1;33m> CANNOT OPEN BINARY ASSET IN TEXT EDITOR: ${path}\x1b[0m`);
           return;
        }
        if (!openFiles.includes(path)) {
          openFiles.push(path);
        }
        let content = FS.readFile(path, { encoding: 'utf8' });
        currentOpenFile = path;
        editor.setValue(content, -1);
        updateTabs();
        refreshSidebar();
        term.writeln(`\x1b[1;32m> OPENED: ${path}\x1b[0m`);
      } catch(e) {
        term.writeln(`\x1b[1;31m> ERROR READING FILE: ${path}\x1b[0m`);
      }
    }
    
    var samples = {
      'hello_world': 'from math import pi, sin, cos\n\nfrom direct.showbase.ShowBase import ShowBase\nfrom direct.task import Task\nfrom direct.actor.Actor import Actor\nfrom direct.interval.IntervalGlobal import Sequence\nfrom panda3d.core import Point3\n\nclass MyApp(ShowBase):\n    def __init__(self):\n        ShowBase.__init__(self)\n\n        # Disable the camera trackball controls.\n        self.disableMouse()\n\n        # Load the environment model.\n        self.scene = self.loader.loadModel("models/environment.bam")\n        # Reparent the model to render.\n        self.scene.reparentTo(self.render)\n        # Apply scale and position transforms on the model.\n        self.scene.setScale(0.25, 0.25, 0.25)\n        self.scene.setPos(-8, 42, 0)\n\n        # Add the spinCameraTask procedure to the task manager.\n        self.taskMgr.add(self.spinCameraTask, "SpinCameraTask")\n\n        # Load and transform the panda actor.\n        self.pandaActor = Actor("models/panda-model.bam",\n                                {"walk": "models/panda-walk4.bam"})\n        self.pandaActor.setScale(0.005, 0.005, 0.005)\n        self.pandaActor.reparentTo(self.render)\n        # Loop its animation.\n        self.pandaActor.loop("walk")\n\n        # Create the four lerp intervals needed for the panda to\n        # walk back and forth.\n        pandaPosInterval1 = self.pandaActor.posInterval(13,\n                                                        Point3(0, -10, 0),\n                                                        startPos=Point3(0, 10, 0))\n        pandaPosInterval2 = self.pandaActor.posInterval(13,\n                                                        Point3(0, 10, 0),\n                                                        startPos=Point3(0, -10, 0))\n        pandaHprInterval1 = self.pandaActor.hprInterval(3,\n                                                        Point3(180, 0, 0),\n                                                        startHpr=Point3(0, 0, 0))\n        pandaHprInterval2 = self.pandaActor.hprInterval(3,\n                                                        Point3(0, 0, 0),\n                                                        startHpr=Point3(180, 0, 0))\n\n        # Create and play the sequence that coordinates the intervals.\n        self.pandaPace = Sequence(pandaPosInterval1,\n                                  pandaHprInterval1,\n                                  pandaPosInterval2,\n                                  pandaHprInterval2,\n                                  name="pandaPace")\n        self.pandaPace.loop()\n\n    # Define a procedure to move the camera.\n    def spinCameraTask(self, task):\n        angleDegrees = task.time * 6.0\n        angleRadians = angleDegrees * (pi / 180.0)\n        self.camera.setPos(20 * sin(angleRadians), -20.0 * cos(angleRadians), 3)\n        self.camera.setHpr(angleDegrees, -10, 0)\n        return Task.cont\n\napp = MyApp()\napp.run()\n',
      'asteroids': '#!/usr/bin/env python\n\n# Author: Shao Zhang, Phil Saltzman, and Greg Lindley\n# Last Updated: 2015-03-13\n#\n# This tutorial demonstrates the use of tasks. A task is a function that\n# gets called once every frame. They are good for things that need to be\n# updated very often. In the case of asteroids, we use tasks to update\n# the positions of all the objects, and to check if the bullets or the\n# ship have hit the asteroids.\n#\n# Note: This definitely a complicated example. Tasks are the cores of\n# most games so it seemed appropriate to show what a full game in Panda\n# could look like.\n\nfrom direct.showbase.ShowBase import ShowBase\nfrom panda3d.core import TextNode, TransparencyAttrib\nfrom panda3d.core import LPoint3, LVector3\nfrom direct.gui.OnscreenText import OnscreenText\nfrom direct.task.Task import Task\nfrom math import sin, cos, pi\nfrom random import randint, choice, random\nfrom direct.interval.MetaInterval import Sequence\nfrom direct.interval.FunctionInterval import Wait, Func\nimport sys\n\n# Constants that will control the behavior of the game. It is good to\n# group constants like this so that they can be changed once without\n# having to find everywhere they are used in code\nSPRITE_POS = 55     # At default field of view and a depth of 55, the screen\n# dimensions is 40x30 units\nSCREEN_X = 20       # Screen goes from -20 to 20 on X\nSCREEN_Y = 15       # Screen goes from -15 to 15 on Y\nTURN_RATE = 360     # Degrees ship can turn in 1 second\nACCELERATION = 10   # Ship acceleration in units/sec/sec\nMAX_VEL = 6         # Maximum ship velocity in units/sec\nMAX_VEL_SQ = MAX_VEL ** 2  # Square of the ship velocity\nDEG_TO_RAD = pi / 180  # translates degrees to radians for sin and cos\nBULLET_LIFE = 2     # How long bullets stay on screen before removed\nBULLET_REPEAT = .2  # How often bullets can be fired\nBULLET_SPEED = 10   # Speed bullets move\nAST_INIT_VEL = 1    # Velocity of the largest asteroids\nAST_INIT_SCALE = 3  # Initial asteroid scale\nAST_VEL_SCALE = 2.2  # How much asteroid speed multiplies when broken up\nAST_SIZE_SCALE = .6  # How much asteroid scale changes when broken up\nAST_MIN_SCALE = 1.1  # If and asteroid is smaller than this and is hit,\n# it disappears instead of splitting up\n\n# This helps reduce the amount of code used by loading objects, since all of\n# the objects are pretty much the same.\ndef loadObject(tex=None, pos=LPoint3(0, 0), depth=SPRITE_POS, scale=1,\n               transparency=True):\n    # Every object uses the plane model and is parented to the camera\n    # so that it faces the screen.\n    obj = loader.loadModel("models/plane.bam")\n    obj.reparentTo(camera)\n\n    # Set the initial position and scale.\n    obj.setPos(pos.getX(), depth, pos.getY())\n    obj.setScale(scale)\n\n    # This tells Panda not to worry about the order that things are drawn in\n    # (ie. disable Z-testing).  This prevents an effect known as Z-fighting.\n    obj.setBin("unsorted", 0)\n    obj.setDepthTest(False)\n\n    if transparency:\n        # Enable transparency blending.\n        obj.setTransparency(TransparencyAttrib.MAlpha)\n\n    if tex:\n        # Load and set the requested texture.\n        tex = loader.loadTexture("textures/" + tex)\n        obj.setTexture(tex, 1)\n\n    return obj\n\n\n# Macro-like function used to reduce the amount to code needed to create the\n# on screen instructions\ndef genLabelText(text, i):\n    return OnscreenText(text=text, parent=base.a2dTopLeft, pos=(0.07, -.06 * i - 0.1),\n                        fg=(1, 1, 1, 1), align=TextNode.ALeft, shadow=(0, 0, 0, 0.5), scale=.05)\n\n\nclass AsteroidsDemo(ShowBase):\n\n    def __init__(self):\n        # Initialize the ShowBase class from which we inherit, which will\n        # create a window and set up everything we need for rendering into it.\n        ShowBase.__init__(self)\n\n        # This code puts the standard title and instruction text on screen\n        self.title = OnscreenText(text="Panda3D: Tutorial - Tasks",\n                                  parent=base.a2dBottomRight, scale=.07,\n                                  align=TextNode.ARight, pos=(-0.1, 0.1),\n                                  fg=(1, 1, 1, 1), shadow=(0, 0, 0, 0.5))\n        self.escapeText = genLabelText("ESC: Quit", 0)\n        self.leftkeyText = genLabelText("[Left Arrow]: Turn Left (CCW)", 1)\n        self.rightkeyText = genLabelText("[Right Arrow]: Turn Right (CW)", 2)\n        self.upkeyText = genLabelText("[Up Arrow]: Accelerate", 3)\n        self.spacekeyText = genLabelText("[Space Bar]: Fire", 4)\n\n        # Disable default mouse-based camera control.  This is a method on the\n        # ShowBase class from which we inherit.\n        self.disableMouse()\n\n        # Load the background starfield.\n        self.setBackgroundColor((0, 0, 0, 1))\n        self.bg = loadObject("stars.jpg", scale=146, depth=200,\n                             transparency=False)\n\n        # Load the ship and set its initial velocity.\n        self.ship = loadObject("ship.png")\n        self.setVelocity(self.ship, LVector3.zero())\n\n        # A dictionary of what keys are currently being pressed\n        # The key events update this list, and our task will query it as input\n        self.keys = {"turnLeft": 0, "turnRight": 0,\n                     "accel": 0, "fire": 0}\n\n        #self.accept("escape", sys.exit)  # Escape quits\n        # Other keys events set the appropriate value in our key dictionary\n        self.accept("arrow_left",     self.setKey, ["turnLeft", 1])\n        self.accept("arrow_left-up",  self.setKey, ["turnLeft", 0])\n        self.accept("arrow_right",    self.setKey, ["turnRight", 1])\n        self.accept("arrow_right-up", self.setKey, ["turnRight", 0])\n        self.accept("arrow_up",       self.setKey, ["accel", 1])\n        self.accept("arrow_up-up",    self.setKey, ["accel", 0])\n        self.accept("space",          self.setKey, ["fire", 1])\n\n        # Now we create the task. taskMgr is the task manager that actually\n        # calls the function each frame. The add method creates a new task.\n        # The first argument is the function to be called, and the second\n        # argument is the name for the task.  It returns a task object which\n        # is passed to the function each frame.\n        self.gameTask = taskMgr.add(self.gameLoop, "gameLoop")\n\n        # Stores the time at which the next bullet may be fired.\n        self.nextBullet = 0.0\n\n        # This list will stored fired bullets.\n        self.bullets = []\n\n        # Complete initialization by spawning the asteroids.\n        self.spawnAsteroids()\n\n    # As described earlier, this simply sets a key in the self.keys dictionary\n    # to the given value.\n    def setKey(self, key, val):\n        self.keys[key] = val\n\n    def setVelocity(self, obj, val):\n        obj.setPythonTag("velocity", val)\n\n    def getVelocity(self, obj):\n        return obj.getPythonTag("velocity")\n\n    def setExpires(self, obj, val):\n        obj.setPythonTag("expires", val)\n\n    def getExpires(self, obj):\n        return obj.getPythonTag("expires")\n\n    def spawnAsteroids(self):\n        # Control variable for if the ship is alive\n        self.alive = True\n        self.asteroids = []  # List that will contain our asteroids\n\n        for i in range(10):\n            # This loads an asteroid. The texture chosen is random\n            # from "asteroid1.png" to "asteroid3.png".\n            asteroid = loadObject("asteroid%d.png" % (randint(1, 3)),\n                                  scale=AST_INIT_SCALE)\n            self.asteroids.append(asteroid)\n\n            # This is kind of a hack, but it keeps the asteroids from spawning\n            # near the player.  It creates the list (-20, -19 ... -5, 5, 6, 7,\n            # ... 20) and chooses a value from it. Since the player starts at 0\n            # and this list doesnt contain anything from -4 to 4, it wont be\n            # close to the player.\n            asteroid.setX(choice(tuple(range(-SCREEN_X, -5)) + tuple(range(5, SCREEN_X))))\n            # Same thing for Y\n            asteroid.setZ(choice(tuple(range(-SCREEN_Y, -5)) + tuple(range(5, SCREEN_Y))))\n\n            # Heading is a random angle in radians\n            heading = random() * 2 * pi\n\n            # Converts the heading to a vector and multiplies it by speed to\n            # get a velocity vector\n            v = LVector3(sin(heading), 0, cos(heading)) * AST_INIT_VEL\n            self.setVelocity(self.asteroids[i], v)\n\n    # This is our main task function, which does all of the per-frame\n    # processing.  It takes in self like all functions in a class, and task,\n    # the task object returned by taskMgr.\n    def gameLoop(self, task):\n        # Get the time elapsed since the next frame.  We need this for our\n        # distance and velocity calculations.\n        dt = globalClock.getDt()\n\n        # If the ship is not alive, do nothing.  Tasks return Task.cont to\n        # signify that the task should continue running. If Task.done were\n        # returned instead, the task would be removed and would no longer be\n        # called every frame.\n        if not self.alive:\n            return Task.cont\n\n        # update ship position\n        self.updateShip(dt)\n\n        # check to see if the ship can fire\n        if self.keys["fire"] and task.time > self.nextBullet:\n            self.fire(task.time)  # If so, call the fire function\n            # And disable firing for a bit\n            self.nextBullet = task.time + BULLET_REPEAT\n        # Remove the fire flag until the next spacebar press\n        self.keys["fire"] = 0\n\n        # update asteroids\n        for obj in self.asteroids:\n            self.updatePos(obj, dt)\n\n        # update bullets\n        newBulletArray = []\n        for obj in self.bullets:\n            self.updatePos(obj, dt)  # Update the bullet\n            # Bullets have an experation time (see definition of fire)\n            # If a bullet has not expired, add it to the new bullet list so\n            # that it will continue to exist.\n            if self.getExpires(obj) > task.time:\n                newBulletArray.append(obj)\n            else:\n                obj.removeNode()  # Otherwise, remove it from the scene.\n        # Set the bullet array to be the newly updated array\n        self.bullets = newBulletArray\n\n        # Check bullet collision with asteroids\n        # In short, it checks every bullet against every asteroid. This is\n        # quite slow.  A big optimization would be to sort the objects left to\n        # right and check only if they overlap.  Framerate can go way down if\n        # there are many bullets on screen, but for the most part its okay.\n        for bullet in self.bullets:\n            # This range statement makes it step though the asteroid list\n            # backwards.  This is because if an asteroid is removed, the\n            # elements after it will change position in the list.  If you go\n            # backwards, the length stays constant.\n            for i in range(len(self.asteroids) - 1, -1, -1):\n                asteroid = self.asteroids[i]\n                # Pandas collision detection is more complicated than we need\n                # here.  This is the basic sphere collision check. If the\n                # distance between the object centers is less than sum of the\n                # radii of the two objects, then we have a collision. We use\n                # lengthSquared() since it is faster than length().\n                if ((bullet.getPos() - asteroid.getPos()).lengthSquared() <\n                    (((bullet.getScale().getX() + asteroid.getScale().getX())\n                      * .5) ** 2)):\n                    # Schedule the bullet for removal\n                    self.setExpires(bullet, 0)\n                    self.asteroidHit(i)      # Handle the hit\n\n        # Now we do the same collision pass for the ship\n        shipSize = self.ship.getScale().getX()\n        for ast in self.asteroids:\n            # Same sphere collision check for the ship vs. the asteroid\n            if ((self.ship.getPos() - ast.getPos()).lengthSquared() <\n                    (((shipSize + ast.getScale().getX()) * .5) ** 2)):\n                # If there is a hit, clear the screen and schedule a restart\n                self.alive = False         # Ship is no longer alive\n                # Remove every object in asteroids and bullets from the scene\n                for i in self.asteroids + self.bullets:\n                    i.removeNode()\n                self.bullets = []          # Clear the bullet list\n                self.ship.hide()           # Hide the ship\n                # Reset the velocity\n                self.setVelocity(self.ship, LVector3(0, 0, 0))\n                Sequence(Wait(2),          # Wait 2 seconds\n                         Func(self.ship.setR, 0),  # Reset heading\n                         Func(self.ship.setX, 0),  # Reset position X\n                         # Reset position Y (Z for Panda)\n                         Func(self.ship.setZ, 0),\n                         Func(self.ship.show),     # Show the ship\n                         Func(self.spawnAsteroids)).start()  # Remake asteroids\n                return Task.cont\n\n        # If the player has successfully destroyed all asteroids, respawn them\n        if len(self.asteroids) == 0:\n            self.spawnAsteroids()\n\n        return Task.cont    # Since every return is Task.cont, the task will\n        # continue indefinitely\n\n    # Updates the positions of objects\n    def updatePos(self, obj, dt):\n        vel = self.getVelocity(obj)\n        newPos = obj.getPos() + (vel * dt)\n\n        # Check if the object is out of bounds. If so, wrap it\n        radius = .5 * obj.getScale().getX()\n        if newPos.getX() - radius > SCREEN_X:\n            newPos.setX(-SCREEN_X)\n        elif newPos.getX() + radius < -SCREEN_X:\n            newPos.setX(SCREEN_X)\n        if newPos.getZ() - radius > SCREEN_Y:\n            newPos.setZ(-SCREEN_Y)\n        elif newPos.getZ() + radius < -SCREEN_Y:\n            newPos.setZ(SCREEN_Y)\n\n        obj.setPos(newPos)\n\n    # The handler when an asteroid is hit by a bullet\n    def asteroidHit(self, index):\n        # If the asteroid is small it is simply removed\n        if self.asteroids[index].getScale().getX() <= AST_MIN_SCALE:\n            self.asteroids[index].removeNode()\n            # Remove the asteroid from the list of asteroids.\n            del self.asteroids[index]\n        else:\n            # If it is big enough, divide it up into little asteroids.\n            # First we update the current asteroid.\n            asteroid = self.asteroids[index]\n            newScale = asteroid.getScale().getX() * AST_SIZE_SCALE\n            asteroid.setScale(newScale)  # Rescale it\n\n            # The new direction is chosen as perpendicular to the old direction\n            # This is determined using the cross product, which returns a\n            # vector perpendicular to the two input vectors.  By crossing\n            # velocity with a vector that goes into the screen, we get a vector\n            # that is orthagonal to the original velocity in the screen plane.\n            vel = self.getVelocity(asteroid)\n            speed = vel.length() * AST_VEL_SCALE\n            vel.normalize()\n            vel = LVector3(0, 1, 0).cross(vel)\n            vel *= speed\n            self.setVelocity(asteroid, vel)\n\n            # Now we create a new asteroid identical to the current one\n            newAst = loadObject(scale=newScale)\n            self.setVelocity(newAst, vel * -1)\n            newAst.setPos(asteroid.getPos())\n            newAst.setTexture(asteroid.getTexture(), 1)\n            self.asteroids.append(newAst)\n\n    # This updates the ships position. This is similar to the general update\n    # but takes into account turn and thrust\n    def updateShip(self, dt):\n        heading = self.ship.getR()  # Heading is the roll value for this model\n        # Change heading if left or right is being pressed\n        if self.keys["turnRight"]:\n            heading += dt * TURN_RATE\n            self.ship.setR(heading % 360)\n        elif self.keys["turnLeft"]:\n            heading -= dt * TURN_RATE\n            self.ship.setR(heading % 360)\n\n        # Thrust causes acceleration in the direction the ship is currently\n        # facing\n        if self.keys["accel"]:\n            heading_rad = DEG_TO_RAD * heading\n            # This builds a new velocity vector and adds it to the current one\n            # relative to the camera, the screen in Panda is the XZ plane.\n            # Therefore all of our Y values in our velocities are 0 to signify\n            # no change in that direction.\n            newVel = \\\n                LVector3(sin(heading_rad), 0, cos(heading_rad)) * ACCELERATION * dt\n            newVel += self.getVelocity(self.ship)\n            # Clamps the new velocity to the maximum speed. lengthSquared() is\n            # used again since it is faster than length()\n            if newVel.lengthSquared() > MAX_VEL_SQ:\n                newVel.normalize()\n                newVel *= MAX_VEL\n            self.setVelocity(self.ship, newVel)\n\n        # Finally, update the position as with any other object\n        self.updatePos(self.ship, dt)\n\n    # Creates a bullet and adds it to the bullet list\n    def fire(self, time):\n        direction = DEG_TO_RAD * self.ship.getR()\n        pos = self.ship.getPos()\n        bullet = loadObject("bullet.png", scale=.2)  # Create the object\n        bullet.setPos(pos)\n        # Velocity is in relation to the ship\n        vel = (self.getVelocity(self.ship) +\n               (LVector3(sin(direction), 0, cos(direction)) *\n                BULLET_SPEED))\n        self.setVelocity(bullet, vel)\n        # Set the bullet expiration time to be a certain amount past the\n        # current time\n        self.setExpires(bullet, time + BULLET_LIFE)\n\n        # Finally, add the new bullet to the list\n        self.bullets.append(bullet)\n\n# We now have everything we need. Make an instance of the class and start\n# 3D rendering\ndemo = AsteroidsDemo()\ndemo.run()\n',
      'music_box': '#!/usr/bin/env python\n\n# Author: Shao Zhang, Phil Saltzman, and Elan Ruskin\n# Last Updated: 2015-03-13\n#\n# This tutorial shows how to load, play, and manipulate sounds\n# and sound intervals in a panda project.\n\nfrom direct.showbase.ShowBase import ShowBase\nfrom panda3d.core import NodePath, TextNode\nfrom panda3d.core import PointLight, AmbientLight\nfrom direct.gui.OnscreenText import OnscreenText\nfrom direct.showbase.DirectObject import DirectObject\nfrom direct.interval.SoundInterval import SoundInterval\nfrom direct.gui.DirectSlider import DirectSlider\nfrom direct.gui.DirectButton import DirectButton\nfrom direct.interval.MetaInterval import Parallel\nfrom direct.interval.LerpInterval import LerpHprInterval\nimport sys\n\n# Create an instance of ShowBase, which will open a window and set up a\n# scene graph and camera.\nbase = ShowBase()\n\nclass MusicBox(DirectObject):\n    def __init__(self):\n        # Our standard title and instructions text\n        self.title = OnscreenText(text="Panda3D: Tutorial - Music Box",\n                                  parent=base.a2dBottomCenter,\n                                  pos=(0, 0.08), scale=0.08,\n                                  fg=(1, 1, 1, 1), shadow=(0, 0, 0, .5))\n        self.escapeText = OnscreenText(text="ESC: Quit", parent=base.a2dTopLeft,\n                                       fg=(1, 1, 1, 1), pos=(0.06, -0.1),\n                                       align=TextNode.ALeft, scale=.05)\n\n        # Set up the key input\n        #self.accept("escape", sys.exit)\n\n        # Fix the camera position\n        base.disableMouse()\n\n        # Loading sounds is done in a similar way to loading other things\n        # Loading the main music box song\n        self.musicBoxSound = loader.loadMusic("music/musicbox.ogg")\n        self.musicBoxSound.setVolume(.5)  # Volume is a percentage from 0 to 1\n        # 0 means loop forever, 1 (default) means\n        # play once. 2 or higher means play that many times\n        self.musicBoxSound.setLoopCount(0)\n\n        # Set up a simple light.\n        self.plight = PointLight("light")\n        self.plight.setColor((0.7, 0.7, 0.5, 1))\n        light_path = base.render.attachNewNode(self.plight)\n        light_path.setPos(0, 0, 20)\n        base.render.setLight(light_path)\n\n        alight = AmbientLight("ambient")\n        alight.setColor((0.3, 0.3, 0.4, 1))\n        base.render.setLight(base.render.attachNewNode(alight))\n\n        # Enable per-pixel lighting\n        base.render.setShaderAuto()\n\n        # Sound objects do not have a pause function, just play and stop. So we will\n        # Use this variable to keep track of where the sound is at when it was stoped\n        # to impliment pausing\n        self.musicTime = 0\n\n        # Loading the open/close effect\n        # loadSFX and loadMusic are identical. They are often used for organization\n        #(loadMusic is used for background music, loadSfx is used for other effects)\n        self.lidSfx = loader.loadSfx("music/openclose.ogg")\n        # The open/close file has both effects in it. Fortunatly we can use intervals\n        # to easily define parts of a sound file to play\n        self.lidOpenSfx = SoundInterval(self.lidSfx, duration=2, startTime=0)\n        self.lidCloseSfx = SoundInterval(self.lidSfx, startTime=5)\n\n        # For this tutorial, it seemed appropriate to have on screen controls.\n        # The following code creates them.\n        # This is a label for a slider\n        self.sliderText = OnscreenText("Volume", pos=(-0.1, 0.87), scale=.07,\n                                       fg=(1, 1, 1, 1), shadow=(0, 0, 0, 1))\n        # The slider itself. It calls self.setMusicBoxVolume when changed\n        self.slider = DirectSlider(pos=(-0.1, 0, .75), scale=0.8, value=.50,\n                                   command=self.setMusicBoxVolume)\n        # A button that calls self.toggleMusicBox when pressed\n        self.button = DirectButton(pos=(.9, 0, .75), text="Open",\n                                   scale=.1, pad=(.2, .2),\n                                   rolloverSound=None, clickSound=None,\n                                   command=self.toggleMusicBox)\n\n        # A variable to represent the state of the simulation. It starts closed\n        self.boxOpen = False\n\n        # Here we load and set up the music box. It was modeled in a complex way, so\n        # setting it up will be complicated\n        self.musicBox = loader.loadModel("models/MusicBox.bam")\n        self.musicBox.setPos(0, 60, -9)\n        self.musicBox.reparentTo(render)\n        # Just like the scene graph contains hierarchies of nodes, so can\n        # models. You can get the NodePath for the node using the find\n        # function, and then you can animate the model by moving its parts\n        # To see the hierarchy of a model, use, the ls function\n        # self.musicBox.ls() prints out the entire hierarchy of the model\n\n        # Finding pieces of the model\n        self.Lid = self.musicBox.find("**/lid")\n        self.Panda = self.musicBox.find("**/turningthing")\n\n        # This model was made with the hinge in the wrong place\n        # this is here so we have something to turn\n        self.HingeNode = self.musicBox.find(\n            "**/box").attachNewNode("nHingeNode")\n        self.HingeNode.setPos(.8659, 6.5, 5.4)\n        # WRT - ie with respect to. Reparents the object without changing\n        # its position, size, or orientation\n        self.Lid.wrtReparentTo(self.HingeNode)\n        self.HingeNode.setHpr(0, 90, 0)\n\n        # This sets up an interval to play the close sound and actually close the box\n        # at the same time.\n        self.lidClose = Parallel(\n            self.lidCloseSfx,\n            LerpHprInterval(self.HingeNode, 2.0, (0, 90, 0), blendType="easeInOut"))\n\n        # Same thing for opening the box\n        self.lidOpen = Parallel(\n            self.lidOpenSfx,\n            LerpHprInterval(self.HingeNode, 2.0, (0, 0, 0), blendType="easeInOut"))\n\n        # The interval for turning the panda\n        self.PandaTurn = self.Panda.hprInterval(7, (360, 0, 0))\n        # Do a quick loop and pause to set it as a looping interval so it can be\n        # started with resume and loop properly\n        self.PandaTurn.loop()\n        self.PandaTurn.pause()\n\n    def setMusicBoxVolume(self):\n        # Simply reads the current value from the slider and sets it in the\n        # sound\n        newVol = self.slider.guiItem.getValue()\n        self.musicBoxSound.setVolume(newVol)\n\n    def toggleMusicBox(self):\n        #if self.lidOpen.isPlaying() or self.lidClose.isPlaying():\n        #    # Its currently already opening or closing\n        #    return\n\n        if self.boxOpen:\n            self.lidOpen.pause()\n\n            self.lidClose.start()  # Start the close box interval\n            self.PandaTurn.pause()  # Pause the figurine turning\n            # Save the current time of the music\n            self.musicTime = self.musicBoxSound.getTime()\n            self.musicBoxSound.stop()  # Stop the music\n            self.button["text"] = "Open"  # Prepare to change button label\n        else:\n            self.lidClose.pause()\n\n            self.lidOpen.start()  # Start the open box interval\n            self.PandaTurn.resume()  # Resume the figuring turning\n            # Reset the time of the music so it starts where it left off\n            self.musicBoxSound.setTime(self.musicTime)\n            self.musicBoxSound.play()  # Play the music\n            self.button["text"] = "Close"  # Prepare to change button label\n\n        self.button.setText()  # Actually change the button label\n        # Set our state to opposite what it was\n        self.boxOpen = not self.boxOpen\n        #(closed to open or open to closed)\n\n# and we can run!\nmb = MusicBox()\nbase.run()\n',
      'emscripten_api_test': '# See https://emscripten.org/docs/api_reference/emscripten.h.html\nimport emscripten\n\n# Run arbitrary JavaScript\nemscripten.run_script("alert(\'This is an alert box!\');")\n\n# ...with a return value\nprint("1 + 1 =", emscripten.run_script_int("1 + 1"))\nprint("location.href =", emscripten.run_script_string("location.href"))\n\n# ...asynchronously, with an optional delay\nscript = "console.log(\'this is written after 1 second\');"\nemscripten.async_run_script(script, millis=1000)\n\n# Call a function after some time\n# (just use Panda\'s task manager instead...)\ndef mycallback():\n    print("\\n...this prints after 2 seconds")\n\nemscripten.async_call(mycallback, millis=2000)\n\n# Shorthands to access DPI, high precision timer, random generator\n# There is no real reason to use these instead of the Panda equivalents\nprint("devicePixelRatio =", emscripten.get_device_pixel_ratio())\nprint("now =", emscripten.get_now())\nprint("random =", emscripten.random())\n\n# Enter debugger / write log messages to JS console\n#emscripten.debugger()\nemscripten.log(1, "Logging message")\nemscripten.log(1 | 2, "Logging warning")\nemscripten.log(1 | 4, "Logging error")\n\n# Asynchronous download to a (virtual) file\ndef onload(handle, file):\n    print(file, "finished downloading! Contents:")\n    print(" ", open(file).read())\n\ndef onerror(handle, status):\n    print("Download failed with code", status)\n\ndef onprogress(handle, progress):\n    print(f"{progress} % downloaded")\n\nprint("Starting download of test.txt")\nemscripten.async_wget2("./test.txt", "targetfile.txt", onload=onload, onerror=onerror, onprogress=onprogress)\n\n# Asynchronous download with data directly available to Python\ndef onload_data(handle, data):\n    print("data finished downloading:")\n    print(" ", data.tobytes())\n\ndef onerror_data(handle, status, msg):\n    print(f"Download failed with code {code}: {msg}")\n\ndef onprogress_data(handle, bytes, total):\n    print(f"Downloaded {bytes} of {total} bytes")\n\nprint("Starting download of test2.txt")\nemscripten.async_wget2_data("./test2.txt", requesttype="GET", onload=onload_data, onerror=onerror_data, onprogress=onprogress_data)\n\n',
      'texture_download': 'from panda3d.core import *\nfrom direct.gui.OnscreenText import OnscreenText\nfrom direct.showbase.ShowBase import ShowBase\nimport emscripten\n\nbase = ShowBase()\n\n# Create fullscreen card\ncm = CardMaker("card")\ncm.set_frame_fullscreen_quad()\ncard = render2d.attach_new_node(cm.generate())\n\ntext = OnscreenText("Starting download...")\n\ndef onload(handle, file):\n    # Download is finished.\n    text.hide()\n    texture = loader.load_texture(file)\n    print(texture)\n    card.set_texture(texture)\n\n\ndef onprogress(handle, progress):\n    text.text = f"{progress} % downloading..."\n    print(text.text)\n\n\ndef onerror(handle, code):\n    text.text = f"Download failed with status code {code}."\n    print(text.text)\n\n\n#url = "http://rdb.name/panda3d-webgl/big-texture.png"\nurl = "./big-texture.png"\n#handle = emscripten.async_wget(url, "big-texture.png", onload, onerror)\nhandle = emscripten.async_wget2(url, "big-texture.png", onload=onload, onerror=onerror, onprogress=onprogress)\n\n\nbase.run()\n',

      term.writeln(`\x1b[1;32m> EXECUTING ${currentOpenFile}...\x1b[0m`);
      
      var runFunc = Module.cwrap('runPythonCode', 'number', ['string'], {async: true});
      // Always run whatever is currently in the active editor buffer
      runFunc(editor.getValue());
    }
    
    function stopCode() {
      var stopFunc = Module.cwrap('stopPythonCode', 'number');
      stopFunc();
      term.writeln('\x1b[1;31m> PROCESS HALTED BY USER.\x1b[0m');
      document.getElementById('stop-button').disabled = true;
    }

    function toggleMenu(id) {
      var all = document.querySelectorAll('.menu-btn');
      all.forEach(function(btn) {
        if (btn.id !== id) btn.classList.remove('open');
      });
      document.getElementById(id).classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.menu-btn')) {
        document.querySelectorAll('.menu-btn').forEach(function(btn) {
          btn.classList.remove('open');
        });
      }
    });

    function newFile() {
      let filename = prompt("Enter new filename (e.g. script.py):");
      if (filename && typeof FS !== 'undefined') {
        let path = '/' + filename;
        FS.writeFile(path, "");
        refreshSidebar();
        openFileFromFS(path);
      }
    }

    function uploadFile() {
      var input = document.createElement('input');
      input.type = 'file';
      input.onchange = function(e) {
        var file = e.target.files[0];
        var reader = new FileReader();
        reader.onload = function(ev) { 
          let data = new Uint8Array(ev.target.result);
          let path = '/' + file.name;
          FS.writeFile(path, data);
          term.writeln(`\x1b[1;32m> UPLOADED SCRIPT: ${path}\x1b[0m`);
          refreshSidebar();
          // Open if it's text
          if (file.name.endsWith('.py') || file.name.endsWith('.txt')) {
            openFileFromFS(path);
          }
        };
        reader.readAsArrayBuffer(file);
      };
      input.click();
    }

    function saveFile() {
      // Physical download to user's computer
      var blob = new Blob([editor.getValue()], { type: 'text/plain' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'main.py';
      a.click();
    }

    function resetToDefault() {
      editor.setValue(defaultCode, -1);
      localStorage.removeItem('editor-contents');
      if (typeof FS !== 'undefined') {
        FS.writeFile('/main.py', defaultCode);
        openFileFromFS('/main.py');
      }
    }

    function includeAssets() {
      var input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.onchange = function(e) {
        var files = Array.from(e.target.files);
        try { FS.mkdir('/assets'); } catch(err) {} // Ensure assets folder exists
        
        files.forEach(function(file) {
          var reader = new FileReader();
          reader.onload = function(ev) {
            var data = new Uint8Array(ev.target.result);
            var path = '/assets/' + file.name;
            FS.writeFile(path, data);
            term.writeln(`\x1b[1;32m> WRITTEN ASSET TO MEMFS: ${path} (${data.length} bytes)\x1b[0m`);
            refreshSidebar();
          };
          reader.readAsArrayBuffer(file);
        });
      };
      input.click();
    }

    function toggleCanvasFullscreen() {
      var el = document.getElementById('canvas');
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) { el.requestFullscreen(); } 
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
      } else {
        if (document.exitFullscreen) { document.exitFullscreen(); }
      }
    }

    function toggleMenu(id) {
      var all = document.querySelectorAll('.menu-btn');
      all.forEach(function(btn) {
        if (btn.id !== id) btn.classList.remove('open');
      });
      document.getElementById(id).classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
      // Close if clicking outside, OR if clicking an actual link <a> inside the dropdown
      if (!e.target.closest('.menu-btn') || e.target.tagName.toLowerCase() === 'a') {
        document.querySelectorAll('.menu-btn').forEach(function(btn) {
          btn.classList.remove('open');
        });
      }
    });

    let dropzone = document.getElementById('dropzone');

    window.addEventListener('dragenter', e => { e.preventDefault(); dropzone.classList.add('active'); });
    dropzone.addEventListener('dragover', e => e.preventDefault() );
    dropzone.addEventListener('dragleave', e => { e.preventDefault(); dropzone.classList.remove('active'); });

    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('active');
      
      if (typeof FS === 'undefined') {
        term.writeln('\x1b[1;31m> SYSTEM ERROR: VFS NOT READY.\x1b[0m');
        return;
      }

      for (let file of e.dataTransfer.files) {
        let reader = new FileReader();
        reader.onload = function(ev) {
          let data = new Uint8Array(ev.target.result);
          // Auto-route media to /assets and scripts to root
          let path = file.name.match(/\.(png|jpg|jpeg|bam|ogg|wav)$/i) ? '/assets/' + file.name : '/' + file.name;
          
          if (path.startsWith('/assets')) { try { FS.mkdir('/assets'); } catch(err) {} }
          
          FS.writeFile(path, data);
          term.writeln(`\x1b[1;32m> RECEIVED: ${path} (${data.length} BYTES)\x1b[0m`);
          refreshSidebar();
          
          if (path.endsWith('.py') || path.endsWith('.txt')) openFileFromFS(path);
        };
        reader.readAsArrayBuffer(file);
      }
    });

    function toggleEditorFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
      } else {
        document.exitFullscreen();
      }
    }

    function switchTheme(themeName) {
      if (themeName === 'classic') {
        document.body.classList.add('theme-classic');
        if (typeof editor !== 'undefined') editor.setTheme("ace/theme/monokai");
        if (typeof term !== 'undefined') term.options.theme = { background: '#181818', foreground: '#eee', cursor: '#eee', selection: 'rgba(255,255,255,0.3)' };
        localStorage.setItem('editor-theme', 'classic');
      } else {
        document.body.classList.remove('theme-classic');
        if (typeof editor !== 'undefined') editor.setTheme("ace/theme/terminal");
        if (typeof term !== 'undefined') term.options.theme = { background: '#050505', foreground: '#00FF41', cursor: '#00FF41', selection: 'rgba(0, 255, 65, 0.3)' };
        localStorage.setItem('editor-theme', 'crt');
      }
    }
  </script>
</head>

<body>
  <div class="scanlines"></div>
  <div id="header">
    <div id="header-left">
      <button class="menu-btn" id="menu-file" onclick="toggleMenu('menu-file')">
        File
        <div class="menu-dropdown" id="dropdown-file">
          <a onclick="newFile()">[+] New</a>
          <a onclick="openFile()">[>] Open...</a>
          <a onclick="saveFile()">[s] Save</a>
          <div class="separator"></div>
          <a onclick="resetToDefault()">[x] Reset</a>
          <div class="separator"></div>
          <a onclick="includeAssets()">[^] Assets...</a>
        </div>
      </button>

      <button class="menu-btn" id="menu-edit" onclick="toggleMenu('menu-edit')">
        Edit
        <div class="menu-dropdown" id="dropdown-edit">
          <a onclick="editor.execCommand('undo')">[<] Undo</a>
          <a onclick="editor.execCommand('redo')">[>] Redo</a>
          <div class="separator"></div>
          <a onclick="editor.execCommand('selectall')">[*] Select All</a>
          <div class="separator"></div>
          <a onclick="switchTheme('crt')">[*] Theme: CRT Hacker</a>
          <a onclick="switchTheme('classic')">[*] Theme: Classic Gray</a>
        </div>
      </button>

      <button class="menu-btn" id="menu-samples" onclick="toggleMenu('menu-samples')">
        Samples
        <div class="menu-dropdown" id="dropdown-samples">
          <a onclick="loadSample('hello_world')">hello_world.py</a>
          <a onclick="loadSample('asteroids')">asteroids.py</a>
          <a onclick="loadSample('music_box')">music_box.py</a>
          <a onclick="loadSample('emscripten_api_test')">emscripten_api_test.py</a>
          <a onclick="loadSample('texture_download')">texture_download.py</a>
          <a onclick="loadSample('browser_interaction')">browser_interaction.py</a>
          <a onclick="loadSample('browser_xhr')">browser_xhr.py</a>
          <a onclick="loadSample('browser_fetch_api')">browser_fetch_api.py</a>
        </div>
      </button>
    </div>

    <div id="header-right">
      <button id="play-button" onclick="runCode()" disabled>
        [ RUN ]
      </button>
      <button id="stop-button" onclick="stopCode()" disabled>
        [ HALT ]
      </button>
      <button id="fs-canvas-btn" onclick="toggleCanvasFullscreen()" disabled>
        [ FS CANVAS ]
      </button>
      <button id="fs-editor-btn" onclick="toggleEditorFullscreen()">
        [ FS EDITOR ]
      </button>
    </div>
  </div>

  <div id="main-area">
    <div id="dropzone" class="blinking-text">>>> DROP ASSETS HERE <<<</div>
    <div id="panel-sidebar">
      <div class="tree-title">SYS_DIR /</div>
      <div id="file-tree">
        <div class="file-item" style="color: var(--fg-secondary);">AWAITING FS...</div>
      </div>
    </div>
    
    <div id="panel-output">
      <div id="main">
        <div id="overlay">
          <div id="center-ui">
            <div id="status" class="blinking-text">INITIALIZING...</div>
            <div id="ldbar-outer"><div id="ldbar"></div></div>
          </div>
        </div>
        <canvas id="canvas" style="display:none;" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      </div>
      <div id="terminal-container"></div>
    </div>
    
    <div id="panel-input">
      <div id="editor-tabs">
        <div class="tab active">main.py</div>
      </div>
      <div id="editor-container">
        <pre id="editor"></pre>
      </div>
    </div>
  </div>

  <div id="credits">
    POWERED BY PANDA3D // EMSCRIPTEN // ACE
  </div>

  <script src="ace/ace.js" type="text/javascript" charset="utf-8"></script>
  <script>
    document.getElementById('editor').innerHTML =
      localStorage.getItem("editor-contents") || defaultCode;

    var editor = ace.edit("editor");
    // Switch to Ace's built-in terminal theme to match our aesthetic
    editor.setTheme("ace/theme/terminal");
    editor.session.setMode("ace/mode/python");
    editor.setShowPrintMargin(false);
    
    // Auto-save typing into the Virtual File System
    editor.session.on('change', function() {
      let code = editor.getValue();
      // Keep localstorage backup for main.py just in case of refresh
      if (currentOpenFile === '/main.py') {
        localStorage.setItem("editor-contents", code);
      }
      // Silently sync to Emscripten FS
      if (typeof FS !== 'undefined') {
        try { FS.writeFile(currentOpenFile, code); } catch(e) {}
      }
    });
  </script>

  <script>
    var term = new Terminal({
      theme: {
        background: '#050505',
        foreground: '#00FF41',
        cursor: '#00FF41',
        selection: 'rgba(0, 255, 65, 0.3)'
      },
      fontFamily: '"VT323", monospace',
      fontSize: 18,
      cursorBlink: true
    });
    
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();
    
    term.writeln('PANDA3D KERNEL BOOT SEQUENCE INITIATED...');
    term.writeln('AWAITING WEBASSEMBLY COMPILER...');

    // Apply saved theme on boot
    if (localStorage.getItem('editor-theme') === 'classic') {
      switchTheme('classic');
    }
  </script>

  <script>
    // 3 Panes: Sidebar, Canvas/Terminal, Editor
    Split(['#panel-sidebar', '#panel-output', '#panel-input'], {
      sizes: [15, 45, 40],
      minSize: [150, 300, 300],
      gutterSize: 8,
      cursor: 'col-resize',
      onDrag: function() { fitAddon.fit(); },
      onDragEnd: function() { fitAddon.fit(); }
    });

    // Vertical split inside Output pane (Canvas top, Terminal bottom)
    Split(['#main', '#terminal-container'], {
      direction: 'vertical',
      sizes: [70, 30],
      minSize: [200, 100],
      gutterSize: 8,
      cursor: 'row-resize',
      onDrag: function() { fitAddon.fit(); },
      onDragEnd: function() {
        fitAddon.fit(); // Resize terminal when pane is dragged
      }
    });
    
    // Ensure terminal resizes on window resize
    window.addEventListener('resize', () => { fitAddon.fit(); });
  </script>

  <script type="text/javascript">
    var EMSCRIPTEN_ASM = 'editor.js';
    var ASM_SIZE = 352844;

    var statusElement  = document.getElementById("status");
    var ldbar          = document.getElementById("ldbar");

    var Module = {
      preRun:  [],
      postRun: [function() {
        var overlay = document.getElementById("overlay");
        if (overlay) overlay.style.display = "none";
        term.writeln('\x1b[1;32mSYSTEM READY. WAITING FOR INPUT.\x1b[0m');

        // Initialize Virtual File System with editor contents
        let initialCode = localStorage.getItem("editor-contents") || defaultCode;
        FS.writeFile('/main.py', initialCode);
        refreshSidebar();
        openFileFromFS('/main.py');
      }],

      // Reroute Emscripten outputs to Xterm.js
      print: function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        term.writeln(text);
      },

      printErr: function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        if (text.includes('Traceback') || text.includes('Error')) {
            term.writeln('\x1b[1;31m' + text + '\x1b[0m'); // Red for errors
        } else if (text.includes('warning') || text.includes('WARNING')) {
            term.writeln('\x1b[1;33m' + text + '\x1b[0m'); // Amber for warnings
        } else {
            term.writeln(text);
        }
      },

      canvas: (function() {
        var canvas = document.getElementById('canvas');
        canvas.contentEditable = true;
        canvas.setAttribute("tabindex", "0");
        canvas.addEventListener('mouseenter', function() { canvas.focus(); }, false);
        return canvas;
      })(),

      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: "" };
        if (text === Module.setStatus.last.text) return;

        var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now   = Date.now();
        if (match && now - Module.setStatus.last.time < 30) return;

        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;

        if (match) {
          statusElement.innerHTML    = "LOADING ASSETS...";
          ldbar.style.width          = (100 * parseInt(match[2]) / parseInt(match[4])) + '%';
        } else {
          statusElement.innerHTML = text.toUpperCase();
        }

        if (text === 'Done!') {
          statusElement.innerHTML = 'READY.';
          statusElement.classList.remove('blinking-text');
          document.getElementById('ldbar-outer').style.display = 'none';
          document.getElementById('play-button').disabled       = false;
          document.getElementById('stop-button').disabled       = false;
          document.getElementById('fs-canvas-btn').disabled     = false;
        }
      },

      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'LINKING... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'LINKING COMPLETE.');
      }
    };

    Module.setStatus('AWAITING CONNECTION...');

    window.onerror = function() {
      Module.setStatus('FATAL SYSTEM ERROR');
      term.writeln('\x1b[1;31m[CRITICAL] BROWSER EXCEPTION CAUGHT.\x1b[0m');
      Module.setStatus = function(t) {
        if (t) Module.printErr('[post-exception status] ' + t);
      };
    };

    (function sendreq() {
      statusElement.innerHTML = "DOWNLOADING KERNEL...";
      var req = new XMLHttpRequest();
      req.onprogress = function(evt) {
        ldbar.style.width = ((evt.loaded / ASM_SIZE) * 100) + '%';
      };
      req.open('GET', EMSCRIPTEN_ASM, true);
      req.onreadystatechange = function() {
        if (req.readyState === 4) {
          Module.setStatus("BOOTING KERNEL...");
          setTimeout(function() {
            var blob   = new Blob([req.responseText], { type: 'text/javascript' });
            var script = document.createElement("script");
            script.type  = "text/javascript";
            script.async = true;
            script.defer = true;
            script.src   = URL.createObjectURL(blob);
            document.body.appendChild(script);
          }, 0);
        }
      };
      req.send();
    })();
  </script>
</body>
</html>
